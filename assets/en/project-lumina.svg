<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Lumina Assistant — AI assistant for HR focused on NR1 and workplace safety. A complete system for accident analysis and prevention, with insights and recommendations." fill="none"><title>Lumina Assistant — AI assistant for HR focused on NR1 and workplace safety. A complete system for accident analysis and prevention, with insights and recommendations.</title><style>
