<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Blue Systems — Marine life monitoring to spot hazards, oil spills and animals that need help." fill="none"><title>Blue Systems — Marine life monitoring to spot hazards, oil spills and animals that need help.</title><style>
.d{font-family:'Archivo','Archivo Black','Arial Black','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.b{font-family:'Archivo','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.08em}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.p{animation:pulse 2s ease-in-out infinite}.g{animation:glow 5s ease-in-out infinite}</style>
<defs><radialGradient id="cg" cx="560" cy="0" r="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a855f7" stop-opacity="0.32"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="600" height="340" rx="20"/></clipPath></defs>
<g clip-path="url(#cc)">
<rect width="600" height="340" fill="#0c0b12"/>
<rect class="g" width="600" height="340" fill="url(#cg)" style="animation-delay:-1.6s"/>
<text class="m" x="40" y="52" font-size="13" fill="#a39db3">MISSION 03/06</text>
<circle class="p" cx="469.3" cy="47" r="5" fill="#a855f7"/>
<text class="m" x="560" y="52" font-size="13" fill="#a855f7" text-anchor="end">COMPLETED</text>
<text class="d" x="38" y="116" font-size="40" fill="#eeeaf6">Blue Systems</text>
<text class="b" x="40" y="156" font-size="17" fill="#a39db3"><tspan x="40" dy="0.0">Marine life monitoring to spot hazards, oil spills and</tspan><tspan x="40" dy="24.6">animals that need help.</tspan></text>
<rect x="40" y="278" width="43" height="30" rx="15" stroke="#eeeaf6" stroke-opacity=".22"/><text class="m" x="61" y="298" font-size="12.5" fill="#eeeaf6" text-anchor="middle">AI</text><rect x="90.8" y="278" width="110" height="30" rx="15" stroke="#eeeaf6" stroke-opacity=".22"/><text class="m" x="146" y="298" font-size="12.5" fill="#eeeaf6" text-anchor="middle">MONITORING</text><rect x="208.8" y="278" width="118" height="30" rx="15" stroke="#eeeaf6" stroke-opacity=".22"/><text class="m" x="268" y="298" font-size="12.5" fill="#eeeaf6" text-anchor="middle">MARINE LIFE</text>
<text class="m" x="560" y="298" font-size="12.5" fill="#a855f7" text-anchor="end">WATCH DEMO ↗</text>
<rect x=".5" y=".5" width="599" height="339" rx="20" stroke="#eeeaf6" stroke-opacity=".09"/>
</g></svg>