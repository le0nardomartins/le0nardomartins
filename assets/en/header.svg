<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Leonardo Martins — Think. Build. Evolve." fill="none"><title>Leonardo Martins — Think. Build. Evolve.</title><style>
.d{font-family:'Archivo','Archivo Black','Arial Black','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
