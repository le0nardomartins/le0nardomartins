<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Achievements unlocked" fill="none"><title>Achievements unlocked</title><style>
.d{font-family:'Archivo','Archivo Black','Arial Black','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.b{font-family:'Archivo','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.08em}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.r{transform-origin:0 0;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}.t{animation:up .7s cubic-bezier(.2,.7,.2,1) both}</style>
<text class="m t" x="2" y="30" font-size="15" fill="#a855f7">05 /</text>
<text class="d t" x="0" y="74" font-size="44" fill="#eeeaf6">Achievements unlocked<tspan fill="#a855f7">.</tspan></text>
<text class="b t" x="1198" y="74" font-size="17" fill="#a39db3" text-anchor="end">Recognition and certifications</text>
<rect class="r" x="0" y="94" width="1200" height="1" fill="#eeeaf6" fill-opacity=".14"/>
<rect class="r" x="0" y="93" width="72" height="3" fill="#a855f7"/></svg>