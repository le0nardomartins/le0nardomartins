<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="4+ Years of dedication · 11+ Years learning · 30+ Projects delivered" fill="none"><title>4+ Years of dedication · 11+ Years learning · 30+ Projects delivered</title><style>
.d{font-family:'Archivo','Archivo Black','Arial Black','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.b{font-family:'Archivo','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.08em}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
