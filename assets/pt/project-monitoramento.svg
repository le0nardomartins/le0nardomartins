<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Monitor de Desastres — Aplicação para monitoramento e alerta de desastres naturais, com interface moderna e notificações em tempo real." fill="none"><title>Monitor de Desastres — Aplicação para monitoramento e alerta de desastres naturais, com interface moderna e notificações em tempo real.</title><style>
