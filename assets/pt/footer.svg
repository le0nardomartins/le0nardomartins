<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Think. Build. Evolve." fill="none"><title>Think. Build. Evolve.</title><style>
.d{font-family:'Archivo','Archivo Black','Arial Black','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.b{font-family:'Archivo','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.08em}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.t{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.g{animation:glow 6s ease-in-out infinite}.c{animation:blink 1.1s steps(1) infinite}</style>
<defs><radialGradient id="fg" cx="600" cy="260" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><clipPath id="fc"><rect width="1200" height="220" rx="22"/></clipPath></defs>
<g clip-path="url(#fc)">
<rect width="1200" height="220" fill="#050508"/>
<rect class="g" width="1200" height="220" fill="url(#fg)"/>
<text class="d t" x="600" y="112" font-size="58" fill="#eeeaf6" text-anchor="middle">Think. Build. <tspan fill="#a855f7">Evolve.</tspan><tspan class="c" fill="#a855f7">▍</tspan></text>
<text class="b t" x="600" y="160" font-size="18" fill="#a39db3" text-anchor="middle" style="animation-delay:.2s">Obrigado pela visita. Se meu perfil combina com o seu time, vamos conversar.</text>
<rect x=".5" y=".5" width="1199" height="219" rx="22" stroke="#eeeaf6" stroke-opacity=".08"/>
</g></svg>